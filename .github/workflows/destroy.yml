name: Terraform Destroy

on:
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Criar arquivo de backend
        run: |
          cat <<EOF > backend-config.tfvars
          ${{ secrets.BACKEND_CONFIG }}
          EOF

      - name: Terraform Init
        run: terraform init -backend-config="backend-config.tfvars"

      - name: Selecionar Workspace Adaptável
        run: |
          # Define o workspace com base na branch (igual ao deploy)
          WORKSPACE=${{ github.ref == 'refs/heads/main' && 'prod' || 'stag' }}
          
          echo "Selecionando ambiente: $WORKSPACE"
          terraform workspace select $WORKSPACE || echo "Workspace não encontrado, nada para destruir."

      - name: Terraform Destroy
        run: terraform destroy -auto-approve